global:
  scrape_interval: 15s

scrape_configs:
  - job_name: backend
    metrics_path: /metrics/prometheus
    static_configs:
      # Substitua pelo host/porta do backend
      - targets: ["backend-host:3000"]

  - job_name: health-readiness
    metrics_path: /health/readiness
    scrape_interval: 30s
    scrape_timeout: 5s
    static_configs:
      - targets: ["backend-host:3000"]

rule_files:
  - ./rules/backend-alerts.yml
