<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>LimpeJá -- Blueprint Premium</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root{
            --bg:#fdfdfd; --card:#ffffff; --muted:#6b7280; --accent:#4f76ed; --accent2:#06b6d4; --success:#16a34ac2;
            --shadow:0 8px 24px rgba(79,70,229,0.15);
            font-family:'Inter',system-ui;
        }
        *{box-sizing:border-box;}
        body{margin:0;background:var(--bg);color:#111827;padding:32px;}
        .container{max-width:1300px;margin:0 auto}
        header{display:flex;align-items:center;gap:20px;margin-bottom:28px;}
        .logo {
            position: relative;
            width: 100px;
            height: 100px;
            border-radius: 24px;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            color: #fff;
            font-size: 22px;
            overflow: hidden;
            animation: float 4s ease-in-out infinite;
        }

        .logo::before {
            content: "";
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            border-radius: 24px;
            padding: 2px;
            background: linear-gradient(45deg, rgba(100, 100, 236, 0.79), #4e70d5ac);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: destination-out;
            mask-composite: exclude;
            pointer-events: none;
        }
        .logo img{width:70%;height:70%;object-fit:contain;}
        @keyframes float{0%{transform:translateY(0)}50%{transform:translateY(-6px)}100%{transform:translateY(0)}}
        h1{margin:0;font-size:26px;font-weight:800;color:#1e1b4b}
        p.lead{color:var(--muted);margin:4px 0 0;font-size:15px}
        .grid{display:grid;grid-template-columns:2fr 1fr;gap:24px}
        .card{background:var(--card);padding:22px;border-radius:16px;box-shadow:var(--shadow);margin-bottom:18px;transition:transform .2s}
        .card:hover{transform:translateY(-3px)}
        .pill{display:inline-flex;align-items:center;gap:10px;background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff;padding:8px 14px;border-radius:999px;font-weight:600;font-size:13px;box-shadow:0 3px 8px rgba(0,0,0,0.1)}
        .highlight{font-size:22px;font-weight:800;color:var(--success);margin-top:14px}
        .phase-list{display:grid;gap:14px;margin-top:20px}
        .phase{display:flex;gap:14px;align-items:flex-start;padding:16px;border-radius:12px;background:linear-gradient(135deg,#eef2ff,#f0f9ff);box-shadow:inset 0 0 6px rgba(79,70,229,0.08)}
        .phase .num{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700}
        .phase h3{margin:0;font-size:17px;color:#1e1b4b}
        .phase p{margin:6px 0 0;color:#374151;font-size:14px}
        .kpis{display:flex;gap:16px;margin-top:18px;flex-wrap:wrap}
        .kpi{flex:1;min-width:120px;background:linear-gradient(135deg,#fff,#f9fafb);border-radius:12px;padding:14px;text-align:center;box-shadow:var(--shadow)}
        .kpi .num{font-weight:800;font-size:20px;color:var(--accent)}
        .kpi span{font-size:12px;color:var(--muted)}
        table{width:100%;border-collapse:collapse;margin-top:14px}
        th,td{padding:10px;border-bottom:1px solid #e5e7eb;font-size:14px}
        th{color:#374151;text-align:left;background:#f9fafb}
        tr:hover td{background:#f3f4f6}
        .roadmap{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-top:16px}
        .rm-card{padding:14px;border-radius:12px;background:linear-gradient(135deg,#ecfdf5,#f0fdfa);box-shadow:inset 0 0 6px rgba(16,185,129,0.15)}
        .rm-card strong{color:#065f46}
        .rm-card p{margin:8px 0 0;font-size:13px;color:#047857}
        .footer{margin-top:24px;padding:18px;border-radius:12px;text-align:center;background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff;font-weight:600;font-size:14px;box-shadow:var(--shadow)}
        .icon{font-size:20px;margin-right:6px}
        
        /* ======== ESTILO ESPECÍFICO DA SEÇÃO (usa suas variáveis do blueprint) ======== */
        #risks .risk-grid{
            display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin:12px 0 6px
        }
        #risks .risk-col{
            background:linear-gradient(135deg,#fff,#f9fafb);
            border:1px solid #eef2ff;border-radius:14px;padding:14px;box-shadow:var(--shadow)
        }
        #risks .risk-title{font-weight:700;color:#1e1b4b;margin-bottom:8px}
        #risks .risk-list{margin:0;padding-left:18px;line-height:1.6;color:#374151;font-size:14px}
        #risks .example{
            display:flex;gap:12px;align-items:flex-start;margin:16px 0 6px;padding:14px;border-radius:14px;
            background:linear-gradient(135deg,#eef2ff,#f0f9ff);box-shadow:inset 0 0 6px rgba(79,70,229,0.08)
        }
        #risks .ex-icon{font-size:22px}
        #risks .ex-title{font-weight:700;color:#1e1b4b;margin-bottom:8px}
        #risks .ex-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
        #risks .ex
